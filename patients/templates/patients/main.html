<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="{% static 'patients/css/style.css' %}" />
  </head>
  <body>
    <div
      style="display: flex; justify-content: space-between; align-items: center"
    >
      {% include "patients/nav.html" %}
    </div>
    {% include "patients/message.html" %} {% block conten %} {% endblock %}
  </body>
  <script>
    function openAddModal() {
      document.getElementById("modalTitle").innerHTML = "Add Patient";

      document.getElementById("patient_id").value = "";

      document.getElementById("name").value = "";

      document.getElementById("age").value = "";

      document.getElementById("address").value = "";

      new bootstrap.Modal(document.getElementById("patientModal")).show();
    }

    function openEditModal(id, name, age, address) {
      document.getElementById("id_firstName").value = name;

      document.getElementById("id_lastName").value = age;

      document.getElementById("id_addrss").value = address;

      new bootstrap.Modal(document.getElementById("staticBackdrop")).show();
    }
  </script>
</html>
